services:
  - type: web
    name: sourced-nexus
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE44_APP_ID
        value: 6abc6a8a4b6c9d175aa35566
      - key: VITE_BASE44_APP_BASE_URL
        value: https://base44.app
